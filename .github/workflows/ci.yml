name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: examples/support-routing
      - run: make ci

  support-routing-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/support-routing/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: examples/support-routing
      - run: npm run build
        working-directory: examples/support-routing
      - run: npm run typecheck
        working-directory: examples/support-routing
      - run: npm test
        working-directory: examples/support-routing
