name: Evals

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      golden:
        description: Also run the golden datasets against their committed snapshots
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run eval:validate
      - run: npm run eval:smoke
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - if: inputs.golden
        run: npm run eval -- --check
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
